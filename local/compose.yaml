# Open-source stand-ins for the AWS services the upload pipeline uses.
# Start with `make local-up`, then run `go run ./cmd/local -image <file>`.
name: primedrive-local

services:
  # Amazon S3 -> SeaweedFS (Apache-2.0), speaking the S3 API on port 8333.
  storage:
    image: chrislusf/seaweedfs:4.53
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - storage:/data

  # Amazon DynamoDB -> DynamoDB Local, kept in memory.
  database:
    image: amazon/dynamodb-local:3.3.2
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports:
      - "8000:8000"

  # Amazon Rekognition -> ResNet-50 trained on ImageNet, served by
  # TensorFlow Serving (Apache-2.0). `make local-model` downloads the model.
  vision:
    image: tensorflow/serving:2.21.0
    environment:
      MODEL_NAME: resnet
    ports:
      - "8501:8501"
    volumes:
      - ./models/resnet:/models/resnet:ro

volumes:
  storage:
